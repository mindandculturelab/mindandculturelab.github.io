<!DOCTYPE html>
<html lang="en">

    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <script src="../../site-config.js"></script>
    <script src="../../assets/js/apply-site-url.js"></script>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap bar">
        <a class="logo" href="../../index.html">
          <img src="../../assets/images/maclab-mark.png" alt="" width="280" height="254" />
          <span>Mind &amp; Culture Lab</span>
        </a>
        <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">Menu</button>
        <nav id="site-nav" class="site-nav" data-nav aria-label="Primary">

          <a href="../../index.html#contact">Contact</a>
        </nav>
      </div>
      <div class="stripe" aria-hidden="true"></div>
    </header>

    <main id="main">
      <section class="hero wrap" id="top">
        <div>
          <p class="eyebrow">Open data</p>
          <h1>Researcher</h1>
        </div>
        <p class="lede">Each person here leads one or more of the studies. Choose a name to see those studies.</p>

      <section class="wrap section" aria-label="Researchers">
        <form class="filters filters-search" id="researcher-search">
          <label>
            Search
            <input type="search" data-researcher-search placeholder="Researcher name" />

        </form>
        <p class="result-count" data-count aria-live="polite">Loading researchers.</p>
        <div class="people" data-people></div>
        <p><a href="../">All ways to look</a></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>© <span data-year>2026</span> Mind &amp; Culture Lab</p>
        <p>Duke University</p>
      </div>
