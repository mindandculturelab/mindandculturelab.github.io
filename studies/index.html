<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Studies — Mind &amp; Culture Lab" />
    <meta property="og:description" content="Each study has its own page." />
    <meta property="og:url" content="https://mindandculturelab.github.io/studies/" />
    <meta property="og:image" content="https://mindandculturelab.github.io/assets/images/og-image.svg" />
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <script src="../site-config.js"></script>
    <script src="../assets/js/apply-site-url.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap bar">
        <a class="logo" href="../index.html">
          <img src="../assets/images/maclab-mark.png" alt="" width="280" height="254" />
          <span>Mind &amp; Culture Lab</span>
        </a>
        <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">Menu</button>
        <nav id="site-nav" class="site-nav" data-nav aria-label="Primary">
          <a href="../index.html#about">About</a>
          <a href="../data/" aria-current="page">Data</a>
          <a href="../index.html#contact">Contact</a>
        </nav>
      </div>
      <div class="stripe" aria-hidden="true"></div>
    </header>

    <main id="main">
      <section class="hero wrap" id="top">
        <div>
          <p class="eyebrow">Directory</p>
          <h1>Studies</h1>
        </div>
        <p class="lede">Each study has its own page, with the people who lead it and the files posted for it.</p>
      </section>

      <section class="wrap section" aria-label="Studies">
        <form class="filters filters-search">
          <label>
            Search
            <input type="search" data-study-search placeholder="Name, topic, or researcher" />
          </label>
        </form>
        <p class="result-count" data-count aria-live="polite">Loading studies.</p>
        <div class="cards" data-studies></div>
        <p><a href="../data/">All ways to look</a></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>© <span data-year>2026</span> Mind &amp; Culture Lab</p>
        <p>Duke University</p>
      </div>
    </footer>
    <script src="../assets/js/main.js"></script>
    <script src="list.js"></script>
  </body>
